name: Auto update/tracking Vietnamese mutual fund

on:
  schedule:
    # Tự động chạy mỗi 1 tiếng từ 16:00 đến 21:00 giờ Việt Nam (9:00 - 14:00 UTC) từ Thứ 2 đến Thứ 6
    # (Đã mở rộng thêm 1 khung giờ để phủ trọn vẹn thời gian khớp lệnh/cập nhật NAV)
    - cron: '0 9-14 * * 1-5'
  
  # Cho phép bấm nút "Run workflow" để chạy thủ công trên giao diện web GitHub
  workflow_dispatch:

jobs:
  run-portfolio:
    runs-on: ubuntu-latest

    # Cấp quyền ghi cần thiết để GitHub Actions có thể push ngược code/data lên repo
    permissions:
      contents: write

    steps:
      # 1. Tải toàn bộ source code từ Repo về máy chủ ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Cài đặt các thư viện từ requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Thực thi file Python main.py
      - name: Execute Main Script
        run: python main.py

      # 5. Lưu các thay đổi (file CSV, HTML) ngược về Repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Lấy thời gian hiện tại theo giờ Việt Nam
          CURRENT_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')
          
          # Kiểm tra thay đổi và commit kèm mốc thời gian động
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update NAV data & charts daily at $CURRENT_TIME [skip ci]" && git push)
