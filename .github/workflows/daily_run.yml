name: Auto update/tracking Vietnamese mutual fund

on:
  schedule:
    # Tự động chạy mỗi 1 tiếng từ 16:00 đến 21:00 giờ Việt Nam (9:00 - 14:00 UTC) từ Thứ 2 đến Thứ 6
    - cron: '0 9-14 * * 1-5'
  
  # Cho phép bấm nút "Run workflow" để chạy thủ công trên giao diện web GitHub
  workflow_dispatch:

# Phân quyền cho toàn bộ workflow (cần thiết cho cả việc push code và deploy Pages)
permissions:
  contents: write
  pages: write
  id-token: write

# Giới hạn chỉ cho phép 1 tiến trình chạy tại một thời điểm để tránh xung đột commit/deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-portfolio:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải toàn bộ source code từ Repo về máy chủ ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Cài đặt các thư viện từ requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Thực thi file Python main.py
      - name: Execute Main Script
        run: python main.py

      # 5. Lưu các thay đổi (file CSV, HTML) ngược về Repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Lấy thời gian hiện tại theo giờ Việt Nam
          CURRENT_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')
          
          # Kiểm tra thay đổi và commit kèm mốc thời gian động
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update NAV data & charts daily at $CURRENT_TIME [skip ci]" && git push)

  # Job mới: Đưa file HTML lên GitHub Pages
  deploy-pages:
    needs: run-portfolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ định thư mục chứa file HTML (hoặc gom file overall_chart.html ra thư mục gốc nếu cần)
          path: './reports'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4